<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro of CSS</title>
  <style>
    * {
      padding: 25px;
    }
    .p1{
      font-size: larger;
      font-weight: 900;
      font-family: 'Times New Roman', Times, serif;
      color: blue;
    }
    #p2{
      font-size: 2rem;
      font-family: Georgia, 'Times New Roman', Times, serif;
      color: darkslateblue;

    }
    h1{
      color: aquamarine;
    }


  </style>

</head>
<body>
  <h1>Hello World</h1>

  <p class="p1">This is a paragraph tag</p>
  <p id="p2">This is a another paragraph tag</p>
  <p class="p1">My name is Muhtadi</p>
  
</body>
</html>
